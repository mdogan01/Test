<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Görev Listesi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Görev Listesi</h1>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Temayı değiştir">◐</button>
    </header>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <input id="todo-input" type="text" placeholder="Yeni görev ekle…" maxlength="200" required>
      <button type="submit">Ekle</button>
    </form>

    <nav class="filters" aria-label="Filtreler">
      <button type="button" data-filter="all" class="active">Tümü</button>
      <button type="button" data-filter="active">Aktif</button>
      <button type="button" data-filter="done">Tamamlanan</button>
    </nav>

    <ul id="todo-list" class="todo-list"></ul>

    <footer class="app-footer">
      <span id="todo-count">0 görev kaldı</span>
      <button id="clear-done" type="button" class="link-btn">Tamamlananları temizle</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
